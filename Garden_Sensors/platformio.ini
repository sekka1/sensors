; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = node_sht31_soil
extra_configs =
    platformio.secrets.ini

[env:esp32_base]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_port = /dev/cu.usbmodem14401
upload_port = /dev/cu.usbmodem14401
upload_speed = 921600
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ${secrets.build_flags}

; Target 1: SHT31 + Soil Moisture (matches current deployment)
[env:node_sht31_soil]
extends = env:esp32_base
build_flags =
    ${env:esp32_base.build_flags}
    -D ENABLE_SHT31=1
    -D ENABLE_SOIL_MOISTURE=1
    -D SENSOR_TYPE_NAME=\"SHT31_SOIL_NODE\"
    -D LED_PIN=8
    -D SOIL_MOISTURE_POWER_PIN=21
    -D SOIL_MOISTURE_PIN=0
    -D TEMP_SENSOR_SDA_PIN=6
    -D TEMP_SENSOR_SCL_PIN=7
lib_deps =
    adafruit/Adafruit SHT31 Library @ ^2.2.2

; Target 2: Soil Moisture only
[env:node_soil]
extends = env:esp32_base
build_flags =
    ${env:esp32_base.build_flags}
    -D ENABLE_SOIL_MOISTURE=1
    -D SENSOR_TYPE_NAME=\"SOIL_NODE\"
    -D LED_PIN=8
    -D SOIL_MOISTURE_POWER_PIN=21
    -D SOIL_MOISTURE_PIN=0

; Target 3: SHT31 temperature/humidity only
[env:node_sht31]
extends = env:esp32_base
build_flags =
    ${env:esp32_base.build_flags}
    -D ENABLE_SHT31=1
    -D SENSOR_TYPE_NAME=\"SHT31_NODE\"
    -D LED_PIN=8
    -D TEMP_SENSOR_SDA_PIN=6
    -D TEMP_SENSOR_SCL_PIN=7
lib_deps =
    adafruit/Adafruit SHT31 Library @ ^2.2.2

; Target 4: Multi-sensor combo alias for future expansion
[env:node_combo]
extends = env:esp32_base
build_flags =
    ${env:esp32_base.build_flags}
    -D ENABLE_SHT31=1
    -D ENABLE_SOIL_MOISTURE=1
    -D SENSOR_TYPE_NAME=\"COMBO_NODE\"
    -D LED_PIN=8
    -D SOIL_MOISTURE_POWER_PIN=21
    -D SOIL_MOISTURE_PIN=0
    -D TEMP_SENSOR_SDA_PIN=6
    -D TEMP_SENSOR_SCL_PIN=7
lib_deps =
    adafruit/Adafruit SHT31 Library @ ^2.2.2

; Local host unit testing (logic-only)
[env:native]
platform = native
test_ignore = test_device
test_build_src = no