; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = node_sht31_soil
extra_configs =
    platformio.secrets.ini

[env:esp32_base]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_port = /dev/cu.usbmodem14401
upload_port = /dev/cu.usbmodem14401
upload_speed = 921600
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ${secrets.build_flags}

[flags:device_esp32_c3_garden_02]
build_flags =
    -D DEVICE_ID=\"esp32-c3-garden-02\"
    -D SENSOR_SEND_INTERVAL_MS=10000

[flags:sensor_soil_moisture_probe_prone]
build_flags =
    -D ENABLE_SOIL_MOISTURE_PROBE_PRONE=1 ; https://www.newegg.com/p/2TP-005G-00D35?srsltid=AfmBOorylsD094xt1YAGT_9lsN36Lr-LCu9arJX4sH59O4PildGx2NKS
    -D SOIL_MOISTURE_PROBE_PRONE_OUTPUT_NAME=\"soil_moisture_probe_prone\"
    -D SOIL_MOISTURE_PROBE_1_POWER_PIN=21
    -D SOIL_MOISTURE_PROBE_1_AO_PIN=0
    -D SOIL_MOISTURE_PROBE_2_POWER_PIN=20
    -D SOIL_MOISTURE_PROBE_2_AO_PIN=1

[flags:sensor_temp_sensor_TO_92]
build_flags =
    -D ENABLE_TEMP_SENSOR_TO_92=1 ; https://www.newegg.com/p/2A7-016F-00040
    -D TEMP_SENSOR_TO_92_OUTPUT_NAME=\"temp_sensor_to_92\"
    -D TEMP_SENSOR_TO_92_SDA_PIN=6
    -D TEMP_SENSOR_TO_92_SCL_PIN=7

[flags:board_common]
build_flags =
    -D LED_PIN=8

; Target 1: Temp Sensor TO-92 + Soil Moisture (matches current deployment)
[env:node_sht31_soil]
extends = env:esp32_base
build_flags =
    ${env:esp32_base.build_flags}
    ${flags:device_esp32_c3_garden_02.build_flags}
    ${flags:board_common.build_flags}
    ${flags:sensor_soil_moisture_probe_prone.build_flags}
    ${flags:sensor_temp_sensor_TO_92.build_flags}
    -D SENSOR_TYPE_NAME=\"SHT31_SOIL_NODE\"
lib_deps =
    adafruit/Adafruit SHT31 Library @ ^2.2.2

; Target 2: Soil Moisture Probe Prone only
[env:node_soil_probe_prone]
extends = env:esp32_base
build_flags =
    ${env:esp32_base.build_flags}
    ${flags:device_esp32_c3_garden_02.build_flags}
    ${flags:board_common.build_flags}
    ${flags:sensor_soil_moisture_probe_prone.build_flags}
    -D SENSOR_TYPE_NAME=\"SOIL_NODE\"

; Target 3: SHT31 temperature/humidity only
[env:node_sht31]
extends = env:esp32_base
build_flags =
    ${env:esp32_base.build_flags}
    ${flags:device_esp32_c3_garden_02.build_flags}
    ${flags:board_common.build_flags}
    ${flags:sensor_temp_sensor_TO_92.build_flags}
    -D SENSOR_TYPE_NAME=\"SHT31_NODE\"
lib_deps =
    adafruit/Adafruit SHT31 Library @ ^2.2.2

; Target 4: Multi-sensor combo alias for future expansion
[env:node_combo]
extends = env:esp32_base
build_flags =
    ${env:esp32_base.build_flags}
    ${flags:device_esp32_c3_garden_02.build_flags}
    ${flags:board_common.build_flags}
    ${flags:sensor_soil_moisture_probe_prone.build_flags}
    ${flags:sensor_temp_sensor_TO_92.build_flags}
    -D SENSOR_TYPE_NAME=\"COMBO_NODE\"
lib_deps =
    adafruit/Adafruit SHT31 Library @ ^2.2.2

; Local host unit testing (logic-only)
[env:native]
platform = native
test_ignore = test_device
test_build_src = no